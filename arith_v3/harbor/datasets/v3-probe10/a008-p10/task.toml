schema_version = "1.4"

[task]
name = "arith-probe/a008-p10"

[metadata]
category = "hypothesis-testing"
case = "A008"
level = 3
difficulty = "L3_cross_mul"
target_operation = "mul"
probe_budget = 10
oracle_reference_no_probes = 0.775

[agent]
timeout_sec = 1800.0
# No public internet for the agent: only the model APIs (and the oracle sidecar).
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "statsig.anthropic.com", "sentry.io", "chatgpt.com", "ab.chatgpt.com", "oracle"]

[verifier]
timeout_sec = 120.0

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800.0
network_mode = "public"
